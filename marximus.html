<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0" />
<title>Dashboard</title>
<link rel="preconnect" href="https://fonts.googleapis.com" />
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
<link href="https://fonts.googleapis.com/css2?family=Spectral:ital,wght@0,400;0,500;0,600;1,400&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet" />
<style>
  :root{
    --paper:#F4F3EF;--card:#FBFAF7;--ink:#181A1C;--ink-2:#5A5C5A;--ink-3:#9A9B96;
    --line:#E2E0D8;--line-2:#D2CFC4;
    --gain:#1E6E4C;--gain-soft:#E7F0EA;--behind:#A6432F;
    --gold:#B8860B;--gold-soft:#FFF8E1;--darkcard:#181A1C;--darkink:#F4F3EF;--inputbg:#fff;
    --display:'Spectral',Georgia,serif;--ui:'Hanken Grotesk',system-ui,sans-serif;--mono:'IBM Plex Mono',ui-monospace,monospace;
  }
  body.dark{
    --paper:#15161A;--card:#1C1E23;--ink:#ECEAE3;--ink-2:#9FA0A6;--ink-3:#6B6C72;
    --line:#2A2C32;--line-2:#3A3D45;
    --gain:#52B083;--gain-soft:#16281F;--behind:#C9684F;
    --gold:#D9AE4A;--gold-soft:#2A2410;--darkcard:#23262C;--darkink:#ECEAE3;--inputbg:#15161A;
  }
  *{box-sizing:border-box;margin:0;padding:0;}
  html{-webkit-text-size-adjust:100%;}
  body{background:var(--paper);color:var(--ink);font-family:var(--ui);line-height:1.45;-webkit-font-smoothing:antialiased;padding:0 0 56px;transition:background .25s,color .25s;}
  .wrap{max-width:520px;margin:0 auto;padding:0 16px;}
  button{font-family:inherit;}
  button:focus-visible,.tab:focus-visible,.exp-btn:focus-visible{outline:2px solid var(--gain);outline-offset:2px;}
  .masthead{padding:26px 0 16px;border-bottom:1px solid var(--line-2);}
  .masthead-row{display:flex;justify-content:space-between;align-items:center;gap:10px;}
  .brand{font-family:var(--mono);font-size:10.5px;letter-spacing:.22em;text-transform:uppercase;color:var(--ink-3);}
  .mast-right{display:flex;align-items:center;gap:12px;}
  .theme-btn{background:transparent;border:1px solid var(--line-2);color:var(--ink-2);width:28px;height:28px;border-radius:50%;cursor:pointer;font-size:13px;line-height:1;display:flex;align-items:center;justify-content:center;}
  .status{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;display:flex;align-items:center;gap:5px;color:var(--ink-3);}
  .status .led{width:7px;height:7px;border-radius:50%;background:var(--ink-3);}
  .status.live .led{background:var(--gain);}
  .client-name{font-family:var(--display);font-weight:500;font-size:30px;letter-spacing:-.01em;margin-top:14px;line-height:1.05;}
  .client-sub{font-family:var(--mono);font-size:11px;letter-spacing:.03em;color:var(--ink-2);margin-top:5px;}
  .sec-label{display:flex;align-items:center;gap:10px;font-family:var(--mono);font-size:10px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin:26px 0 12px;}
  .sec-label::after{content:"";flex:1;height:1px;background:var(--line);}
  .sec-label .edit-hint{font-size:8.5px;letter-spacing:.12em;opacity:.8;}
  .paceline{font-family:var(--mono);font-size:10.5px;color:var(--ink-2);text-align:center;padding:12px 4px 0;line-height:1.6;}
  .paceline strong{color:var(--ink);}
  .tabs{display:flex;gap:6px;background:var(--card);border:1px solid var(--line);border-radius:11px;padding:4px;margin:22px 0 0;}
  .tab{flex:1;text-align:center;padding:10px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;border-radius:8px;cursor:pointer;color:var(--ink-3);user-select:none;}
  .tab.active{background:var(--ink);color:var(--paper);}
  .pos{color:var(--gain);}.neg{color:var(--behind);}.muted{color:var(--ink-3);}
  /* bodyweight */
  .nav-top{display:flex;justify-content:space-between;align-items:flex-end;}
  .nav-figure{font-family:var(--display);font-weight:600;font-size:58px;line-height:.92;letter-spacing:-.02em;cursor:pointer;}
  .nav-figure .unit{font-size:22px;font-weight:400;color:var(--ink-2);margin-left:4px;}
  .nav-figure .pencil{font-size:13px;color:var(--ink-3);margin-left:8px;vertical-align:middle;}
  .nav-input{font-family:var(--display);font-weight:600;font-size:46px;width:160px;border:none;border-bottom:2px solid var(--gain);background:transparent;color:var(--ink);outline:none;}
  .nav-delta{text-align:right;font-family:var(--mono);font-size:13px;line-height:1.3;}
  .nav-delta .big{font-size:16px;font-weight:600;display:block;}
  .ledger-bar{margin-top:18px;}
  .ledger-track{position:relative;height:8px;background:var(--line);border-radius:2px;}
  .ledger-fill{position:absolute;left:0;top:0;bottom:0;background:var(--gain);border-radius:2px;width:0;transition:width 1.1s cubic-bezier(.2,.7,.2,1);}
  .ledger-tick{position:absolute;top:-5px;bottom:-5px;width:2px;background:var(--ink);right:0;}
  .ledger-mile{position:absolute;top:-4px;bottom:-4px;width:2px;background:var(--gold);}
  .ledger-mile span{position:absolute;top:-16px;left:50%;transform:translateX(-50%);font-family:var(--mono);font-size:9px;color:var(--gold);white-space:nowrap;}
  .ledger-ends{display:flex;justify-content:space-between;margin-top:8px;font-family:var(--mono);font-size:10.5px;color:var(--ink-3);}
  .ledger-ends .goal{color:var(--ink);}
  /* expander */
  .expander{margin-top:12px;}
  .exp-btn{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);border:1px dashed var(--line-2);border-radius:8px;padding:9px 12px;text-align:center;cursor:pointer;user-select:none;}
  .exp-body{margin-top:10px;background:var(--card);border:1px solid var(--line);border-radius:12px;padding:14px 14px 8px;}
  .exp-note{font-family:var(--mono);font-size:10px;color:var(--ink-3);text-align:center;padding:6px 0 8px;}
  .wchart{width:100%;height:auto;display:block;}
  /* cards */
  .card{background:var(--card);border:1px solid var(--line);border-radius:12px;padding:16px 18px;}
  .row-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:12px;gap:10px;}
  .row-title{font-weight:600;font-size:15px;}
  .row-meta{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);text-align:right;}
  .row-meta b{color:var(--gain);}
  .sess-dots{display:flex;gap:8px;margin-bottom:14px;}
  .sdot{width:30px;height:30px;border-radius:50%;border:1.5px solid var(--line-2);display:flex;align-items:center;justify-content:center;font-family:var(--mono);font-size:10px;color:var(--ink-3);}
  .sdot.f{background:var(--gain);border-color:var(--gain);color:#fff;}
  .sdot.g{background:var(--gold);border-color:var(--gold);color:#1c1500;}
  .btn-row{display:flex;gap:8px;flex-wrap:wrap;}
  .log-btn{font-weight:600;font-size:13px;padding:10px 15px;border-radius:8px;border:1px solid var(--line-2);background:transparent;color:var(--ink);cursor:pointer;}
  .log-btn.primary{background:var(--gain);border-color:var(--gain);color:#fff;}
  .chips{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;}
  .chip{font-family:var(--mono);font-size:10.5px;padding:5px 10px;border-radius:999px;background:var(--gain-soft);color:var(--gain);cursor:pointer;border:none;}
  .chip span{opacity:.6;margin-left:5px;}
  .hint{font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:10px;}
  .streak{display:flex;align-items:center;justify-content:space-between;padding:16px 18px;background:var(--darkcard);color:var(--darkink);border-radius:12px;margin-top:12px;gap:14px;}
  .streak-fig{font-family:var(--display);font-weight:600;font-size:42px;line-height:.9;}
  .streak-unit{font-size:13px;font-weight:500;color:#A7A99F;}
  .streak-best{font-family:var(--mono);font-size:11px;color:#A7A99F;}
  .pips{display:flex;gap:5px;flex-wrap:wrap;justify-content:flex-end;max-width:150px;}
  .pip{width:17px;height:17px;border-radius:50%;background:var(--gain);display:flex;align-items:center;justify-content:center;font-size:10px;}
  .pip.star{background:var(--gold);color:#1c1500;}
  /* fuel */
  .daynav{display:flex;align-items:center;justify-content:space-between;margin-bottom:12px;}
  .daynav button{background:transparent;border:1px solid var(--line-2);color:var(--ink);width:34px;height:34px;border-radius:8px;cursor:pointer;font-size:16px;}
  .daynav button:disabled{opacity:.3;cursor:default;}
  .daynav .dlabel{font-weight:600;font-size:14px;}
  .kc-big{font-family:var(--display);font-weight:600;font-size:40px;line-height:1;}
  .kc-big .of{font-family:var(--mono);font-size:13px;font-weight:400;color:var(--ink-3);margin-left:4px;}
  .meter{height:8px;background:var(--line);border-radius:4px;overflow:hidden;margin:12px 0 8px;}
  .meter>div{height:100%;background:var(--gain);border-radius:4px;}
  .meter.hit>div{background:var(--gold);}
  .kc-sub{display:flex;justify-content:space-between;font-family:var(--mono);font-size:11.5px;color:var(--ink-2);}
  .kc-sub b{color:var(--ink);}
  .food-list{list-style:none;margin-top:14px;border-top:1px solid var(--line);}
  .food-list li{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:9px 0;border-bottom:1px dashed var(--line);font-size:13.5px;}
  .food-list .fm{font-family:var(--mono);font-size:11.5px;color:var(--ink-2);white-space:nowrap;}
  .food-list .del{background:transparent;border:none;color:var(--ink-3);font-size:16px;cursor:pointer;padding:0 4px;}
  .food-empty{font-family:var(--mono);font-size:11px;color:var(--ink-3);padding:12px 0 2px;}
  .food-add{display:flex;flex-wrap:wrap;gap:6px;margin-top:14px;}
  .food-add input,.lift-log input,.mr-form input{font-family:var(--mono);font-size:16px;padding:8px 10px;border:1px solid var(--line-2);border-radius:8px;background:var(--inputbg);color:var(--ink);min-width:0;}
  .food-add .fname{flex:1 1 100%;}
  .food-add .fnum{flex:1 1 0;}
  .food-add button,.mini-btn{font-weight:600;font-size:13px;padding:8px 14px;border-radius:8px;border:none;background:var(--gain);color:#fff;cursor:pointer;}
  .wk-stats{font-family:var(--mono);font-size:11px;color:var(--ink-2);text-align:center;margin-top:6px;}
  /* workout */
  .prog-head{display:flex;justify-content:space-between;align-items:baseline;margin-bottom:8px;}
  .prog-name{font-family:var(--display);font-weight:600;font-size:21px;}
  .prog-tag{font-family:var(--mono);font-size:10px;letter-spacing:.12em;text-transform:uppercase;color:var(--gain);}
  .prog-desc{font-size:13.5px;color:var(--ink-2);line-height:1.55;}
  .ex-row{display:flex;justify-content:space-between;align-items:baseline;padding:10px 0;border-bottom:1px dashed var(--line);font-size:15px;gap:12px;}
  .ex-row:last-child{border-bottom:none;}
  .ex-name{font-weight:600;}
  .ex-scheme{font-family:var(--mono);font-size:13px;color:var(--ink-2);text-align:right;}
  .ex-row.rest .ex-name,.ex-row.rest .ex-scheme{color:var(--ink-3);font-weight:500;}
  .scale-note{font-size:12.5px;color:var(--ink-2);line-height:1.5;margin-top:12px;padding:10px 12px;background:var(--paper);border:1px solid var(--line);border-radius:8px;}
  .timer{background:var(--darkcard);color:var(--darkink);border-radius:14px;padding:20px 18px;margin-top:12px;text-align:center;}
  .tmr{font-family:var(--mono);font-weight:600;font-size:60px;letter-spacing:.02em;line-height:1;}
  .tmr-state{font-family:var(--mono);font-size:10px;letter-spacing:.18em;text-transform:uppercase;color:#A7A99F;margin-top:8px;}
  .rounds{display:flex;align-items:center;justify-content:center;gap:16px;margin:18px 0 16px;}
  .rnd-num{font-family:var(--display);font-weight:600;font-size:44px;line-height:1;min-width:60px;}
  .rnd-label{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:#A7A99F;}
  .rnd-btn{width:64px;height:64px;border-radius:50%;border:none;background:var(--gain);color:#fff;font-size:20px;font-weight:700;cursor:pointer;}
  .rnd-btn.minus{width:40px;height:40px;font-size:18px;background:transparent;border:1px solid #4a4d52;color:#C9CBC2;}
  .tmr-btns{display:flex;gap:8px;justify-content:center;flex-wrap:wrap;}
  .tbtn{font-weight:600;font-size:14px;padding:11px 18px;border-radius:9px;border:1px solid #4a4d52;background:transparent;color:var(--darkink);cursor:pointer;}
  .tbtn.go{background:var(--gain);border-color:var(--gain);color:#fff;}
  .tbtn.gold{background:var(--gold);border-color:var(--gold);color:#1c1500;}
  .mr-form{display:flex;gap:6px;align-items:center;margin-top:12px;font-size:12.5px;color:var(--ink-2);flex-wrap:wrap;}
  .mr-form input{width:80px;}
  .score{display:flex;gap:10px;margin-top:12px;}
  .score-box{flex:1;background:var(--card);border:1px solid var(--line);border-radius:10px;padding:12px;text-align:center;}
  .score-num{font-family:var(--display);font-weight:600;font-size:26px;line-height:1.1;}
  .score-label{font-family:var(--mono);font-size:9px;letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);margin-top:3px;}
  /* lifts */
  .positions{border-top:1px solid var(--line);}
  .pos-row{display:grid;grid-template-columns:1fr 60px auto;gap:12px;align-items:center;padding:13px 0;border-bottom:1px solid var(--line);cursor:pointer;}
  .pos-name{font-weight:600;font-size:15px;}
  .pos-name .pr{color:var(--gold);font-size:11px;margin-left:5px;}
  .pos-detail{font-family:var(--mono);font-size:10.5px;color:var(--ink-3);margin-top:2px;}
  .spark{width:60px;height:24px;display:block;}
  .pos-figs{text-align:right;}
  .pos-e1rm{font-family:var(--mono);font-size:14px;font-weight:600;}
  .pos-chg{font-family:var(--mono);font-size:11px;margin-top:2px;}
  .lift-log{grid-column:1/-1;display:flex;gap:8px;align-items:center;padding-top:10px;}
  .lift-log input{width:84px;}
  .lift-log .x{font-family:var(--mono);color:var(--ink-3);}
  /* coach + archive */
  .coach{padding:18px 20px;background:var(--card);border:1px solid var(--line);border-radius:12px;}
  .coach-from{font-family:var(--mono);font-size:9.5px;letter-spacing:.2em;text-transform:uppercase;color:var(--ink-3);margin-bottom:8px;}
  .coach-msg{font-family:var(--display);font-style:italic;font-size:16.5px;line-height:1.45;color:var(--ink);}
  .ck-week{margin-bottom:10px;border:1px solid var(--line);border-radius:10px;overflow:hidden;background:var(--card);}
  .ck-head{cursor:pointer;padding:13px 15px;display:flex;justify-content:space-between;align-items:center;user-select:none;}
  .ck-wk-name{font-weight:600;font-size:14px;}
  .ck-wk-meta{font-family:var(--mono);font-size:11px;color:var(--ink-2);}
  .ck-body{padding:13px 15px;border-top:1px solid var(--line);}
  .ck-stat-row{display:flex;justify-content:space-between;padding:6px 0;border-bottom:1px dashed var(--line);font-size:13px;gap:10px;}
  .ck-stat-label{color:var(--ink-2);}
  .ck-stat-val{font-family:var(--mono);font-weight:600;text-align:right;}
  .ck-note{font-size:13px;color:var(--ink-2);line-height:1.5;margin-top:10px;padding-top:10px;border-top:1px dashed var(--line);}
  .ck-note b{color:var(--ink);}
  .empty-hint{font-family:var(--mono);font-size:11px;color:var(--ink-3);}
  .updated{text-align:center;font-family:var(--mono);font-size:10px;color:var(--ink-3);margin-top:28px;letter-spacing:.06em;}
  /* coach panel */
  .panel{margin-top:26px;border:1px dashed var(--line-2);border-radius:10px;overflow:hidden;}
  .panel summary{cursor:pointer;list-style:none;padding:13px 16px;font-family:var(--mono);font-size:10.5px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-2);display:flex;justify-content:space-between;}
  .panel summary::-webkit-details-marker{display:none;}
  .panel[open] summary{border-bottom:1px dashed var(--line-2);}
  .panel-body{padding:14px 16px;}
  .panel-body p{font-size:12px;color:var(--ink-2);margin-bottom:10px;line-height:1.5;}
  .panel-body h4{font-family:var(--mono);font-size:10px;letter-spacing:.14em;text-transform:uppercase;color:var(--ink-3);margin:18px 0 8px;font-weight:500;}
  .panel-actions{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:12px;}
  .btn{font-weight:600;font-size:12.5px;padding:9px 15px;border-radius:8px;border:none;background:var(--ink);color:var(--paper);cursor:pointer;}
  .btn.ghost{background:transparent;border:1px solid var(--line-2);color:var(--ink-2);}
  textarea{width:100%;font-family:var(--mono);font-size:12px;line-height:1.5;padding:12px;border:1px solid var(--line-2);border-radius:8px;background:var(--inputbg);color:var(--ink);resize:vertical;}
  #json-input{min-height:200px;}
  #food-json{min-height:110px;}
  .toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%);background:var(--ink);color:var(--paper);font-family:var(--mono);font-size:12px;padding:11px 18px;border-radius:8px;opacity:0;transition:opacity .25s;pointer-events:none;z-index:50;max-width:90%;text-align:center;}
  .toast.show{opacity:1;}
  @media(prefers-reduced-motion:reduce){.ledger-fill{transition:none;}body{transition:none;}}
</style>
</head>
<body>
<div class="wrap" id="app"></div>
<div class="toast" id="toast" role="status" aria-live="polite"></div>
<div class="wrap">
<details class="panel">
  <summary><span>Coach panel</span><span>&#9662;</span></summary>
  <div class="panel-body">
    <p><strong>Daily food:</strong> paste the JSON array Claude gives you from the client's meal messages, then Add.</p>
    <textarea id="food-json" spellcheck="false" placeholder='[{"date":"2026-10-08","name":"Sultana Bran + oat milk","kcal":350,"protein":10}]'></textarea>
    <div class="panel-actions" style="margin-top:8px;"><button class="btn" id="food-add-json">Add food entries</button></div>
    <h4>Weekly check-in</h4>
    <p>Copy current data &rarr; run the weekly prompt in Claude &rarr; paste the result &rarr; Apply &rarr; Push to cloud. GitHub is only for layout changes.</p>
    <div class="panel-actions">
      <button class="btn" id="copy">Copy current data</button>
      <button class="btn ghost" id="push">Push to cloud</button>
      <button class="btn ghost" id="reset">Reset to file</button>
    </div>
    <textarea id="json-input" spellcheck="false"></textarea>
    <div class="panel-actions" style="margin-top:10px;"><button class="btn" id="apply">Apply JSON</button></div>
  </div>
</details>
</div>

function clone(o){ return JSON.parse(JSON.stringify(o)); }
function pad2(n){ return String(n).padStart(2,'0'); }
function ymd(d){ d=d||new Date(); return d.getFullYear()+'-'+pad2(d.getMonth()+1)+'-'+pad2(d.getDate()); }
function pd(s){ var p=String(s).split('-'); return new Date(+p[0],(+p[1])-1,+p[2]); }
function addDays(s,n){ var d=pd(s); d.setDate(d.getDate()+n); return ymd(d); }
function weekStart(s){ var d=pd(s); d.setDate(d.getDate()-((d.getDay()+6)%7)); return ymd(d); }
function fmtDate(s){ return pd(s).toLocaleDateString('en-AU',{day:'numeric',month:'short'}); }
function fmtMonth(s){ return pd(s).toLocaleDateString('en-AU',{month:'short'}); }
function dowShort(s){ return ['Sun','Mon','Tue','Wed','Thu','Fri','Sat'][pd(s).getDay()]; }
function round1(n){ return Math.round(n*10)/10; }
function e1rm(w,r){ return w*(1+r/30); }
function byDate(a,b){ return a.date<b.date?-1:a.date>b.date?1:0; }
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,7); }
function esc(x){ return String(x==null?'':x).replace(/[&<>"']/g,function(c){return {'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c];}); }
function toast(m){ var t=document.getElementById('toast'); t.textContent=m; t.classList.add('show'); clearTimeout(toast._t); toast._t=setTimeout(function(){t.classList.remove('show');},1900); }
function val(id){ var el=document.getElementById(id); return el?el.value:''; }
function sum(a,f){ return a.reduce(function(t,x){ return t+(f(x)||0); },0); }

/* ---------------- migration: works on any older saved shape ---------------- */
function mergeBy(a,b,key){ a=Array.isArray(a)?a.slice():[]; (b||[]).forEach(function(x){ if(!a.some(function(y){return y[key]===x[key];})) a.push(clone(x)); }); return a; }
function sameEntry(a,b){ return a.date===b.date && a.reps===b.reps && (a.weight||0)===(b.weight||0); }
function mergeHist(a,b){ a=(a||[]).slice(); (b||[]).forEach(function(e){ if(!a.some(function(x){return sameEntry(x,e);})) a.push(clone(e)); }); return a.sort(byDate); }
function mergeLifts(target,src){
  var out=(target||[]).map(clone);
  (src||[]).forEach(function(l){ if(!l||!l.name) return; var m=out.find(function(x){return x.name===l.name;});
    if(m) m.history=mergeHist(m.history,l.history); else if(l.history&&l.history.length) out.push(clone(l)); });
  return out;
}
function migrate(s){
  s=(s&&typeof s==='object')?s:{};
  var seedNames=SEED.lifts.map(function(l){return l.name;});
  var oldLifts=Array.isArray(s.lifts)?s.lifts:[];
  /* lifts no longer on the program are archived, never deleted */
  s.liftsArchive=mergeLifts(s.liftsArchive, oldLifts.filter(function(l){return seedNames.indexOf(l.name)<0;}));
  s.liftsArchive=mergeLifts(s.liftsArchive, SEED.liftsArchive);
  s.lifts=SEED.lifts.map(function(sl){
    var m=oldLifts.find(function(l){return l.name===sl.name;});
    var o={ name:sl.name, scheme:sl.scheme, history:mergeHist(m?m.history:[], sl.history) };
    if(sl.bodyweight) o.bodyweight=true; return o;
  });
  /* coach-controlled content: replaced whenever the file's contentVersion moves up */
  if((s.contentVersion||0)<SEED.contentVersion){
    s.client=clone(SEED.client); s.program=clone(SEED.program); s.coachNotes=clone(SEED.coachNotes);
    s.streak=clone(SEED.streak); s.weekTarget=SEED.weekTarget; s.contentVersion=SEED.contentVersion;
  }
  s.client=Object.assign(clone(SEED.client), s.client||{});
  if(!s.program) s.program=clone(SEED.program);
  if(!s.coachNotes) s.coachNotes=clone(SEED.coachNotes);
  if(!s.streak) s.streak=clone(SEED.streak);
  if(!Array.isArray(s.streak.starWeeks)) s.streak.starWeeks=[];
  if(!s.weekTarget) s.weekTarget=SEED.weekTarget;
  if(!Array.isArray(s.weekLog)) s.weekLog=[];
  s.bodyweight=mergeBy(s.bodyweight,SEED.bodyweight,'date').sort(byDate);
  if(!s.bodyweight.length) s.bodyweight=[{date:s.client.startDate,kg:s.client.startWeight}];
  s.checkins=mergeBy(s.checkins,SEED.checkins,'week').sort(function(a,b){return a.week-b.week;});
  s.rounds=(s.rounds||[]).slice(); (SEED.rounds||[]).forEach(function(r){ if(!s.rounds.some(function(x){return x.date===r.date&&x.rounds===r.rounds;})) s.rounds.push(clone(r)); }); s.rounds.sort(byDate);
  s.foodLog=mergeBy(s.foodLog,SEED.foodLog,'id').sort(byDate);
  if(!s.asOf||s.asOf<SEED.asOf) s.asOf=SEED.asOf;
  return s;
}

/* ---------------- charts ---------------- */
function sparkline(pts){
  var w=60,h=24,pad=3;
  if(pts.length<2) return '<svg class="spark" viewBox="0 0 '+w+' '+h+'"><line x1="'+pad+'" y1="'+(h/2)+'" x2="'+(w-pad)+'" y2="'+(h/2)+'" stroke="var(--line)" stroke-width="1.5"/></svg>';
  var mn=Math.min.apply(null,pts),mx=Math.max.apply(null,pts),sp=(mx-mn)||1,st=(w-pad*2)/(pts.length-1);
  var c=pts.map(function(v,i){return [pad+i*st,h-pad-((v-mn)/sp)*(h-pad*2)];});
  var d=c.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ');
  var l=c[c.length-1];
  return '<svg class="spark" viewBox="0 0 '+w+' '+h+'" fill="none"><path d="'+d+'" stroke="var(--gain)" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/><circle cx="'+l[0].toFixed(1)+'" cy="'+l[1].toFixed(1)+'" r="2.2" fill="var(--gain)"/></svg>';
}
/* pts: [{label, v|null}] · opts: {mode:'bars'|'line', target, fmt, values, empty} */
function chart(pts,opts){
  opts=opts||{}; var fmt=opts.fmt||function(v){return round1(v);};
  var vals=pts.filter(function(p){return p.v!=null;}).map(function(p){return p.v;});
  if(!vals.length) return '<div class="exp-note">'+esc(opts.empty||'No data yet.')+'</div>';
  var W=440,H=150,padL=36,padR=12,padT=20,padB=24,iw=W-padL-padR,n=pts.length;
  var vmax=(Math.max.apply(null,vals.concat([opts.target||0]))*1.15)||1;
  function Y(v){ return padT+(1-v/vmax)*(H-padT-padB); }
  function X(i){ return opts.mode==='bars' ? padL+(i+0.5)*(iw/n) : (n===1? padL+iw/2 : padL+i*(iw/(n-1))); }
  var o='<svg class="wchart" viewBox="0 0 '+W+' '+H+'" fill="none">';
  o+='<line x1="'+padL+'" y1="'+Y(0)+'" x2="'+(W-padR)+'" y2="'+Y(0)+'" stroke="var(--line-2)" stroke-width="1"/>';
  var mid=vmax/2;
  o+='<line x1="'+padL+'" y1="'+Y(mid)+'" x2="'+(W-padR)+'" y2="'+Y(mid)+'" stroke="var(--line)" stroke-width="1"/>';
  o+='<text x="'+(padL-5)+'" y="'+(Y(mid)+3)+'" text-anchor="end" font-size="9" fill="var(--ink-3)" font-family="IBM Plex Mono">'+esc(fmt(mid))+'</text>';
  if(opts.target){
    o+='<line x1="'+padL+'" y1="'+Y(opts.target)+'" x2="'+(W-padR)+'" y2="'+Y(opts.target)+'" stroke="var(--gold)" stroke-width="1" stroke-dasharray="4 4"/>';
    o+='<text x="'+(W-padR)+'" y="'+(Y(opts.target)-5)+'" text-anchor="end" font-size="9" fill="var(--gold)" font-family="IBM Plex Mono">target '+esc(fmt(opts.target))+'</text>';
  }
  if(opts.mode==='bars'){
    var bw=Math.min(30,(iw/n)*0.62);
    pts.forEach(function(p,i){
      if(p.v==null){ o+='<circle cx="'+X(i).toFixed(1)+'" cy="'+(Y(0)-3)+'" r="2" fill="var(--line-2)"/>'; return; }
      var y=Y(p.v), hit=opts.target&&p.v>=opts.target;
      o+='<rect x="'+(X(i)-bw/2).toFixed(1)+'" y="'+y.toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+Math.max(0,Y(0)-y).toFixed(1)+'" rx="3" fill="'+(hit?'var(--gold)':'var(--gain)')+'"/>';
      if(opts.values&&n<=8) o+='<text x="'+X(i).toFixed(1)+'" y="'+(y-4).toFixed(1)+'" text-anchor="middle" font-size="9" fill="var(--ink-2)" font-family="IBM Plex Mono">'+esc(fmt(p.v))+'</text>';
    });
  } else {
    var seg=[]; pts.forEach(function(p,i){ if(p.v!=null) seg.push([X(i),Y(p.v)]); });
    if(seg.length>1) o+='<path d="'+seg.map(function(q,i){return (i?'L':'M')+q[0].toFixed(1)+' '+q[1].toFixed(1);}).join(' ')+'" stroke="var(--gain)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
    seg.forEach(function(q){ o+='<circle cx="'+q[0].toFixed(1)+'" cy="'+q[1].toFixed(1)+'" r="3" fill="var(--gain)"/>'; });
  }
  var step=Math.ceil(n/8);
  pts.forEach(function(p,i){ if(i%step===0||i===n-1) o+='<text x="'+X(i).toFixed(1)+'" y="'+(H-7)+'" text-anchor="middle" font-size="9" fill="var(--ink-3)" font-family="IBM Plex Mono">'+esc(p.label)+'</text>'; });
  o+='</svg>';
  if(vals.length===1&&opts.mode!=='bars') o+='<div class="exp-note">One data point so far — the trend builds from here.</div>';
  return o;
}
function bwChart(){

  o+='<path d="'+pts.map(function(p,i){return (i?'L':'M')+p[0].toFixed(1)+' '+p[1].toFixed(1);}).join(' ')+'" stroke="var(--gain)" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>';
  pts.forEach(function(p){ o+='<circle cx="'+p[0].toFixed(1)+'" cy="'+p[1].toFixed(1)+'" r="2.6" fill="var(--gain)"/>'; });
  o+='<text x="'+padL+'" y="'+(H-8)+'" font-size="9" fill="var(--ink-3)" font-family="IBM Plex Mono">'+fmtDate(bw[0].date)+'</text><text x="'+(W-padR)+'" y="'+(H-8)+'" text-anchor="end" font-size="9" fill="var(--ink-3)" font-family="IBM Plex Mono">'+fmtDate(bw[bw.length-1].date)+'</text></svg>';
  return o;
}

function isEditing(){
  var a=document.activeElement;
  return ui.editWeight||ui.logLift!==null||!!(a&&a.closest&&a.closest('#app')&&/INPUT|TEXTAREA/.test(a.tagName));
}
function expander(key,inner,label){
  var open=!!ui.exp[key];
  return '<div class="expander"><div class="exp-btn" role="button" tabindex="0" data-act="exp" data-key="'+key+'">'+(open?'hide progress ▴':(label||'tap to see progress')+' ▾')+'</div>'+(open?'<div class="exp-body">'+inner+'</div>':'')+'</div>';
}
function coachCard(text,label){
  return '<div class="sec-label">'+esc(label||'From your coach')+'</div><div class="coach"><div class="coach-from">'+esc(COACH)+'</div><div class="coach-msg">'+esc(text)+'</div></div>';
}
function thisWeekLog(){ var ws=weekStart(ymd()); return state.weekLog.filter(function(e){ return weekStart(e.date)===ws; }); }
function curKg(){ var b=state.bodyweight; return b[b.length-1].kg; }

function paceline(){
  var c=state.client, bw=state.bodyweight, cur=curKg();
  var tgt = (c.milestone && cur<c.milestone) ? {kg:c.milestone,date:c.milestoneDate,label:c.milestoneLabel||fmtDate(c.milestoneDate)} : {kg:c.goalWeight,date:c.goalDate,label:fmtMonth(c.goalDate)};
  if(cur>=tgt.kg) return '<strong>'+tgt.kg+'kg reached</strong> &middot; nice work';
  var wksLeft=(pd(tgt.date)-pd(ymd()))/(7*864e5);
  if(wksLeft<=0) return 'Next target <strong>'+tgt.kg+'kg</strong> &middot; date passed — set a new one';
  var need=(tgt.kg-cur)/wksLeft;
  var f=bw[0], l=bw[bw.length-1], wks=(pd(l.date)-pd(f.date))/(7*864e5);
  var line='Next: <strong>'+tgt.kg+'kg by '+esc(tgt.label)+'</strong> &middot; needs <strong>+'+need.toFixed(2)+'kg/wk</strong>';
  if(wks>0.5){ var act=(l.kg-f.kg)/wks; line+='<br>averaging <span class="'+(act>=need?'pos':'neg')+'">'+(act>=0?'+':'')+act.toFixed(2)+'kg/wk</span> since '+fmtDate(f.date); }
  return line;
}

/* ---------------- CONSISTENCY TAB ---------------- */
function buildBodyweight(){
  var c=state.client, cur=curKg(), start=c.startWeight, goal=c.goalWeight;
  var delta=round1(cur-start), pct=Math.max(0,Math.min(1,(cur-start)/(goal-start))), rem=round1(goal-cur);
  var mp=c.milestone?Math.max(0,Math.min(1,(c.milestone-start)/(goal-start)))*100:null;
  return '<div class="sec-label">Bodyweight<span class="edit-hint">tap to edit</span></div><div class="nav-top">'
    +(ui.editWeight?'<input class="nav-input" id="bw-input" type="number" step="0.1" inputmode="decimal" value="'+cur+'" aria-label="Bodyweight in kg" />':'<div class="nav-figure" role="button" tabindex="0" data-act="editweight">'+cur.toFixed(1)+'<span class="unit">kg</span><span class="pencil">✎</span></div>')
    +'<div class="nav-delta"><span class="big '+(delta>=0?'pos':'neg')+'">'+(delta>=0?'+':'')+delta+' kg</span><span class="muted">since start</span></div></div>'
    +'<div class="ledger-bar"><div class="ledger-track"><div class="ledger-fill" id="fill" data-pct="'+(pct*100)+'"></div>'
    +(mp!==null?'<div class="ledger-mile" style="left:'+mp+'%"><span>'+c.milestone+'</span></div>':'')
    +'<div class="ledger-tick"></div></div><div class="ledger-ends"><span>'+start+'kg</span><span class="goal">'+goal+'kg &middot; '+rem+'kg to go</span></div></div>'
    +expander('bw',bwChart());
}
function buildSessions(){
  var D=state, wk=thisWeekLog(), n=wk.length, T=D.weekTarget;
  var dots=''; for(var i=0;i<Math.max(T,n);i++){ var cls=i<n?(n>=T?'g':'f'):''; dots+='<div class="sdot '+cls+'">'+(i<n?'✓':(i+1))+'</div>'; }
  var chips=wk.map(function(s){ var idx=D.weekLog.indexOf(s); return '<button class="chip" data-act="unlog" data-i="'+idx+'" aria-label="Remove session">'+dowShort(s.date)+' '+fmtDate(s.date)+(s.rounds?' &middot; '+s.rounds+' rds':'')+'<span>×</span></button>'; }).join('');
  var total=Math.max(D.streak.bestWeeks,D.streak.currentWeeks), pips='';
  for(var k=1;k<=total;k++){ var st=D.streak.starWeeks.indexOf(k)>=0; pips+='<div class="pip '+(st?'star':'')+'">'+(st?'★':'')+'</div>'; }
  var hist=(D.checkins||[]).filter(function(c){return c.sessionsDone!=null;}).map(function(c){return {label:'W'+c.week,v:c.sessionsDone};});
  return '<div class="sec-label">Consistency<span class="edit-hint">log each session</span></div>'
    +'<div class="card"><div class="row-head"><span class="row-title">This week</span><span class="row-meta"><b>'+n+'</b> / '+T+' &middot; 2 keeps streak &middot; 3 = ★</span></div>'
    +'<div class="sess-dots">'+dots+'</div>'
    +'<div class="btn-row"><button class="log-btn primary" data-act="logsess">+ Log session</button></div>'
    +(chips?'<div class="chips">'+chips+'</div>':'')
    +'<div class="hint">Used the timer on the Training tab? It logs automatically.</div></div>'
    +'<div class="streak"><div><div style="display:flex;align-items:baseline;gap:6px;margin-bottom:4px;"><span class="streak-fig">'+D.streak.currentWeeks+'</span><span class="streak-unit">week streak</span></div><div class="streak-best">Best &middot; '+D.streak.bestWeeks+' &middot; ★ = all '+T+'</div></div><div class="pips">'+pips+'</div></div>'
    +expander('sess',chart(hist,{mode:'bars',target:T,values:true,fmt:function(v){return Math.round(v);},empty:'Weekly totals appear after check-ins.'}));
}
function dayTotals(d){ var e=state.foodLog.filter(function(x){return x.date===d;}); return {n:e.length,kcal:sum(e,function(x){return x.kcal;}),prot:sum(e,function(x){return x.protein;})}; }
function buildFuel(){
  var c=state.client, today=ymd(), day=fuelDay||today, isToday=day===today;
  var entries=state.foodLog.filter(function(x){return x.date===day;});
  var t=dayTotals(day), pct=c.kcalTarget?Math.min(1,t.kcal/c.kcalTarget):0, hit=t.kcal>=c.kcalTarget;
  var label=isToday?'Today':(day===addDays(today,-1)?'Yesterday':dowShort(day)+' '+fmtDate(day));
  var list=entries.length
    ? '<ul class="food-list">'+entries.map(function(x){ return '<li><span>'+esc(x.name)+'</span><span style="display:flex;align-items:center;gap:6px;"><span class="fm">'+x.kcal+' kcal'+(x.protein!=null?' · '+x.protein+'g':'')+'</span><button class="del" data-act="delfood" data-id="'+esc(x.id)+'" aria-label="Delete '+esc(x.name)+'">×</button></span></li>'; }).join('')+'</ul>'
    : '<div class="food-empty">Nothing logged for '+(isToday?'today':'this day')+' yet.</div>';
  /* last 7 days */
  var pts=[], tot=0, days=0;
  for(var i=6;i>=0;i--){ var d=addDays(today,-i), dt=dayTotals(d); pts.push({label:dowShort(d).slice(0,2),v:dt.n?dt.kcal:null}); if(dt.n){tot+=dt.kcal;days++;} }
  /* weekly averages across all logged weeks */
  var wk={}; state.foodLog.forEach(function(x){ var w=weekStart(x.date); wk[w]=wk[w]||{}; wk[w][x.date]=(wk[w][x.date]||0)+(x.kcal||0); });
  var wpts=Object.keys(wk).sort().map(function(w){ var ds=Object.keys(wk[w]); return {label:fmtDate(w),v:Math.round(sum(ds,function(d){return wk[w][d];})/ds.length)}; });
  return '<div class="sec-label">Fuel &middot; food log<span class="edit-hint">add what was eaten</span></div>'
    +'<div class="card">'
    +'<div class="daynav"><button data-act="day" data-d="-1" aria-label="Previous day">‹</button><span class="dlabel">'+label+'</span><button data-act="day" data-d="1" aria-label="Next day"'+(isToday?' disabled':'')+'>›</button></div>'
    +'<div class="kc-big">'+t.kcal.toLocaleString()+'<span class="of">/ '+c.kcalTarget.toLocaleString()+' kcal</span></div>'
    +'<div class="meter'+(hit?' hit':'')+'"><div style="width:'+(pct*100)+'%"></div></div>'
    +'<div class="kc-sub"><span>Protein <b>'+t.prot+'g</b> / '+c.proteinTarget+'g</span><span>'+(hit?'<b>target hit</b>':'<b>'+Math.max(0,c.kcalTarget-t.kcal).toLocaleString()+'</b> to go')+'</span></div>'
    +list
    +'<form class="food-add" data-submit="food" autocomplete="off"><input class="fname" id="fd-name" placeholder="Meal or snack" aria-label="Meal or snack" /><input class="fnum" id="fd-kcal" type="number" inputmode="numeric" placeholder="kcal" aria-label="Calories" /><input class="fnum" id="fd-prot" type="number" inputmode="numeric" placeholder="protein g" aria-label="Protein grams" /><button type="submit">Add</button></form>'
    +'</div>'
    +'<div class="exp-body" style="margin-top:12px;">'+chart(pts,{mode:'bars',target:c.kcalTarget,values:true,fmt:function(v){return v>=1000?(round1(v/1000))+'k':Math.round(v);},empty:'The last 7 days chart fills in as food gets logged.'})
    +'<div class="wk-stats">Last 7 days &middot; '+(days?'avg <b>'+Math.round(tot/days).toLocaleString()+' kcal</b> &middot; ':'')+'logged '+days+'/7 days</div></div>'
    +expander('fuel',chart(wpts,{mode:'line',target:c.kcalTarget,fmt:function(v){return Math.round(v).toLocaleString();},empty:'Weekly averages appear once food is logged.'}),'tap to see weekly trend');
}
function buildArchive(){
  var cks=(state.checkins||[]).slice().reverse(), out='<div class="sec-label">Check-in archive</div>';
  if(!cks.length) return out+'<div class="empty-hint">Weekly check-ins will appear here.</div>';
  cks.forEach(function(c){
    var open=!!ui.ck[c.week];
    var wt=c.weightAvg!=null?c.weightAvg.toFixed(1)+'kg':(c.weightEst?'~'+c.weightEst+' est':'—');
    out+='<div class="ck-week"><div class="ck-head" role="button" tabindex="0" data-act="ck" data-w="'+c.week+'"><span class="ck-wk-name">Week '+c.week+'</span><span class="ck-wk-meta">'+fmtDate(c.date)+' &middot; '+wt+' '+(open?'▴':'▾')+'</span></div>';
    if(open){
      var row=function(l,v){ return '<div class="ck-stat-row"><span class="ck-stat-label">'+l+'</span><span class="ck-stat-val">'+esc(v)+'</span></div>'; };
      out+='<div class="ck-body">'
        +(c.weightAvg!=null?row('Bodyweight',c.weightAvg.toFixed(1)+'kg'):(c.weightEst?row('Bodyweight (unverified)','~'+c.weightEst+'kg'):''))
        +(c.sessionsDone!=null?row('Sessions',c.sessionsDone+'/'+(c.sessionsPlanned||state.weekTarget)):'')
        +(c.bestRounds!=null?row('Best rounds',c.bestRounds):'')
        +(c.kcalAvg!=null?row('Avg kcal / day',c.kcalAvg.toLocaleString()):'')
        +(c.mealsAvg!=null?row('Meals / day',c.mealsAvg):'')
        +(c.sleep?row('Sleep',c.sleep):'')
        +(c.wins?'<div class="ck-note"><b>Wins:</b> '+esc(c.wins)+'</div>':'')
        +(c.flags?'<div class="ck-note"><b>Watch:</b> '+esc(c.flags)+'</div>':'')
        +(c.focus?'<div class="ck-note"><b>Next week:</b> '+esc(c.focus)+'</div>':'')
        +'</div>';
    }
    out+='</div>';
  });
  return out;
}
function buildConsistency(){
  return buildBodyweight()+buildSessions()+buildFuel()+coachCard(state.coachNotes.consistency,'Coach · consistency')+buildArchive();
}

/* ---------------- TRAINING TAB ---------------- */
var timer={st:'idle',remaining:0,endAt:0,rounds:0,iv:null,lock:null};
function progSecs(){ return ((state.program&&state.program.minutes)||20)*60; }
function tmrText(){ var s=Math.ceil(timer.st==='idle'?progSecs():timer.remaining); return Math.floor(s/60)+':'+pad2(s%60); }
function lockScreen(on){ try{ if(on&&navigator.wakeLock){ navigator.wakeLock.request('screen').then(function(l){timer.lock=l;}).catch(function(){}); } else if(!on&&timer.lock){ timer.lock.release(); timer.lock=null; } }catch(e){} }
function tick(){
  if(timer.st!=='running') return;
  timer.remaining=Math.max(0,(timer.endAt-Date.now())/1000);
  var el=document.getElementById('tmr'); if(el) el.textContent=tmrText();
  if(timer.remaining<=0){ clearInterval(timer.iv); timer.st='done'; lockScreen(false); try{navigator.vibrate&&navigator.vibrate([300,150,300]);}catch(e){} toast('Time — log your rounds'); render(); }
}
function timerStart(){ if(timer.st==='idle') timer.remaining=progSecs(); timer.endAt=Date.now()+timer.remaining*1000; timer.st='running'; clearInterval(timer.iv); timer.iv=setInterval(tick,250); lockScreen(true); render(); }
function timerPause(){ timer.remaining=Math.max(0,(timer.endAt-Date.now())/1000); timer.st='paused'; clearInterval(timer.iv); lockScreen(false); render(); }
function timerReset(){ clearInterval(timer.iv); lockScreen(false); timer.st='idle'; timer.rounds=0; timer.remaining=0; render(); }
function logRounds(r,mins){
  var d=ymd(); state.rounds.push({date:d,rounds:r,minutes:mins}); state.weekLog.push({date:d,type:'Circuit',rounds:r});
  persist(); toast('Session logged · '+r+' rounds');
}
function buildTraining(){
  var P=state.program, R=state.rounds||[];
  var exs=(P.exercises||[]).map(function(x){ return '<div class="ex-row"><span class="ex-name">'+esc(x.name)+'</span><span class="ex-scheme">'+esc(x.reps)+'</span></div>'; }).join('')
    +'<div class="ex-row rest"><span class="ex-name">Rest</span><span class="ex-scheme">'+P.restSec+' sec</span></div>';
  var running=timer.st==='running', paused=timer.st==='paused', done=timer.st==='done', idle=timer.st==='idle';
  var stateLabel=idle?'ready when you are':running?'go — tap +1 after each round':paused?'paused':'time — log it';
  var btns=idle?'<button class="tbtn go" data-act="t-start">Start '+P.minutes+':00</button>'
    :running?'<button class="tbtn" data-act="t-pause">Pause</button><button class="tbtn gold" data-act="t-log">Finish &amp; log</button>'
    :'<button class="tbtn go" data-act="t-start"'+(done?' hidden':'')+'>Resume</button><button class="tbtn gold" data-act="t-log">Log '+timer.rounds+' rounds</button><button class="tbtn" data-act="t-reset">Reset</button>';
  var best=R.length?Math.max.apply(null,R.map(function(r){return r.rounds;})):null, last=R.length?R[R.length-1]:null;
  var rpts=R.slice(-12).map(function(r){return {label:fmtDate(r.date),v:r.rounds};});
  var lifts=state.lifts.map(function(l,i){
    var h=l.history, main;
    if(h.length){
      if(l.bodyweight){
        var a=h[h.length-1], b=h[0], ch=a.reps-b.reps, pr=a.reps>=Math.max.apply(null,h.map(function(s){return s.reps;}));
        main='<div><div class="pos-name">'+esc(l.name)+(pr&&h.length>1?'<span class="pr">★ PR</span>':'')+'</div><div class="pos-detail">'+esc(l.scheme||'bodyweight')+'</div></div>'+sparkline(h.map(function(s){return s.reps;}))+'<div class="pos-figs"><div class="pos-e1rm">'+a.reps+'<span class="muted"> reps</span></div><div class="pos-chg '+(ch>=0?'pos':'neg')+'">'+(ch>=0?'+':'')+ch+' reps</div></div>';
      } else {
        var lt=h[h.length-1], fr=h[0], en=e1rm(lt.weight,lt.reps), es=e1rm(fr.weight,fr.reps), c2=round1(en-es), pr2=en>=Math.max.apply(null,h.map(function(s){return e1rm(s.weight,s.reps);}));
        main='<div><div class="pos-name">'+esc(l.name)+(pr2&&h.length>1?'<span class="pr">★ PR</span>':'')+'</div><div class="pos-detail">'+esc(l.scheme||'')+' &middot; last '+lt.weight+'kg × '+lt.reps+'</div></div>'+sparkline(h.map(function(s){return e1rm(s.weight,s.reps);}))+'<div class="pos-figs"><div class="pos-e1rm">'+round1(en)+'<span class="muted"> e1rm</span></div><div class="pos-chg '+(c2>=0?'pos':'neg')+'">'+(c2>=0?'+':'')+c2+'</div></div>';
      }
    } else {
      main='<div><div class="pos-name">'+esc(l.name)+'</div><div class="pos-detail">'+esc(l.scheme||'')+' &middot; tap to log</div></div><span></span><div class="pos-figs muted" style="font-family:var(--mono);font-size:11px;">—</div>';
    }
    var logger='';
    if(ui.logLift===i) logger=l.bodyweight
      ? '<form class="lift-log" data-submit="lift" data-i="'+i+'"><input id="lr" type="number" inputmode="numeric" placeholder="reps" aria-label="Reps" /><button class="mini-btn" type="submit">Log</button></form>'
      : '<form class="lift-log" data-submit="lift" data-i="'+i+'"><input id="lw" type="number" step="0.5" inputmode="decimal" placeholder="kg" aria-label="Weight kg" /><span class="x">&times;</span><input id="lr" type="number" inputmode="numeric" placeholder="reps" aria-label="Reps" /><button class="mini-btn" type="submit">Log</button></form>';
    return '<div class="pos-row" data-act="openlift" data-i="'+i+'">'+main+logger+'</div>';
  }).join('');
  return '<div class="sec-label">The workout &middot; '+P.minutes+' min &middot; '+P.perWeek+'×/week</div>'
    +'<div class="card"><div class="prog-head"><span class="prog-name">'+esc(P.name)+'</span><span class="prog-tag">repeat for '+P.minutes+' min</span></div>'
    +'<div class="prog-desc">'+esc(P.description)+'</div><div style="margin-top:10px;">'+exs+'</div>'
    +(P.scaling?'<div class="scale-note">'+esc(P.scaling)+'</div>':'')+'</div>'
    +'<div class="timer"><div class="tmr" id="tmr" aria-live="off">'+tmrText()+'</div><div class="tmr-state">'+stateLabel+'</div>'
    +'<div class="rounds"><button class="rnd-btn minus" data-act="t-minus" aria-label="Remove a round">−</button><div><div class="rnd-num">'+timer.rounds+'</div><div class="rnd-label">rounds</div></div><button class="rnd-btn" data-act="t-plus" aria-label="Add a round">+1</button></div>'
    +'<div class="tmr-btns">'+btns+'</div></div>'
    +'<form class="mr-form" data-submit="rounds" autocomplete="off"><span>No timer? Log rounds:</span><input id="mr-rounds" type="number" inputmode="numeric" placeholder="e.g. 8" aria-label="Rounds completed" /><button class="mini-btn" type="submit">Log</button></form>'
    +'<div class="score"><div class="score-box"><div class="score-num">'+(best!=null?best:'—')+'</div><div class="score-label">best rounds</div></div><div class="score-box"><div class="score-num">'+(last?last.rounds:'—')+'</div><div class="score-label">last session</div></div><div class="score-box"><div class="score-num">'+R.length+'</div><div class="score-label">sessions logged</div></div></div>'
    +expander('rounds',chart(rpts,{mode:'bars',values:true,fmt:function(v){return Math.round(v);},empty:'Your first session sets the number to beat.'}))
    +'<div class="sec-label">Extras<span class="edit-hint">only if there\'s more in the tank</span></div><div class="positions">'+lifts+'</div>'
    +coachCard(state.coachNotes.training,'Coach · training');
}

/* ---------------- render ---------------- */
function render(){
  var D=state, c=D.client, cur=curKg();
  document.title=c.name+' — Dashboard';
  document.getElementById('app').innerHTML=
    '<header class="masthead"><div class="masthead-row"><span class="brand">'+esc(BRAND)+'</span>'
    +'<span class="mast-right"><button class="theme-btn" data-act="theme" aria-label="Toggle dark mode">'+(document.body.classList.contains('dark')?'☀':'☾')+'</button>'
    +'<span class="status'+(cloud?' live':'')+'"><span class="led"></span><span>'+(cloud?'live sync':'on-device')+'</span></span></span></div>'
    +'<div class="client-name">'+esc(c.name)+'</div>'
    +'<div class="client-sub">'+c.heightCm+'cm &middot; '+cur.toFixed(1)+' &rarr; '+(c.milestone?c.milestone+'kg by '+esc(c.milestoneLabel||fmtMonth(c.milestoneDate))+' &rarr; ':'')+c.goalWeight+'kg by '+fmtMonth(c.goalDate)+'</div></header>'
    +'<div class="tabs" role="tablist"><div class="tab'+(currentTab==='consistency'?' active':'')+'" role="tab" tabindex="0" data-act="tab" data-tab="consistency">Consistency</div><div class="tab'+(currentTab==='training'?' active':'')+'" role="tab" tabindex="0" data-act="tab" data-tab="training">Training</div></div>'
    +'<div class="paceline">'+paceline()+'</div>'
    +(currentTab==='consistency'?buildConsistency():buildTraining())
    +coachCard(D.coachNotes.headline)
    +'<div class="updated">Last updated '+fmtDate(D.asOf)+'</div>';
  var fl=document.getElementById('fill'); if(fl){ if(render._anim){ fl.style.transition='none'; fl.style.width=fl.dataset.pct+'%'; } else { render._anim=true; requestAnimationFrame(function(){ fl.style.width=fl.dataset.pct+'%'; }); } }
  if(ui.editWeight){
    var inp=document.getElementById('bw-input');
    if(inp){ inp.focus(); inp.select(); var done=false;
      var commit=function(){ if(done) return; done=true; var v=parseFloat(inp.value); ui.editWeight=false;
        if(!isNaN(v)&&v>20&&v<300){ var t=ymd(), ex=state.bodyweight.find(function(b){return b.date===t;}); if(ex) ex.kg=v; else state.bodyweight.push({date:t,kg:v}); state.bodyweight.sort(byDate); persist(); }
        applyPendingOrRender(); };
      inp.addEventListener('blur',commit);
      inp.addEventListener('keydown',function(e){ if(e.key==='Enter') commit(); if(e.key==='Escape'){ done=true; ui.editWeight=false; applyPendingOrRender(); } });
    }
  }
  if(ui.logLift!==null){ var l=state.lifts[ui.logLift], ff=l&&document.getElementById(l.bodyweight?'lr':'lw'); if(ff) ff.focus(); }
  if(ui.refocus){ var rf=document.getElementById(ui.refocus); ui.refocus=null; if(rf) rf.focus(); }
}

/* ---------------- events ---------------- */
function act(el,e){
  var a=el.dataset.act, i=el.dataset.i!==undefined?parseInt(el.dataset.i,10):null;
  if(a==='tab'){ currentTab=el.dataset.tab; ui.logLift=null; ui.editWeight=false; render(); }
  else if(a==='theme'){ document.body.classList.toggle('dark'); try{localStorage.setItem('hw_theme',document.body.classList.contains('dark')?'dark':'light');}catch(x){} render(); }
  else if(a==='exp'){ ui.exp[el.dataset.key]=!ui.exp[el.dataset.key]; render(); }
  else if(a==='ck'){ ui.ck[el.dataset.w]=!ui.ck[el.dataset.w]; render(); }
  else if(a==='editweight'){ ui.editWeight=true; render(); }
  else if(a==='logsess'){ state.weekLog.push({date:ymd(),type:'Circuit'}); persist(); render(); toast('Session logged'); }
  else if(a==='unlog'){ state.weekLog.splice(i,1); persist(); render(); toast('Session removed'); }
  else if(a==='day'){ var t=ymd(), nd=addDays(fuelDay||t,parseInt(el.dataset.d,10)); fuelDay=nd>t?t:nd; render(); }
  else if(a==='delfood'){ var id=el.dataset.id; state.foodLog=state.foodLog.filter(function(x){return x.id!==id;}); persist(); render(); }
  else if(a==='openlift'){ if(e&&e.target.closest('.lift-log')) return; ui.logLift=(ui.logLift===i?null:i); render(); }
  else if(a==='t-start') timerStart();
  else if(a==='t-pause') timerPause();
  else if(a==='t-reset'){ if(timer.rounds>0&&!confirm('Discard this session ('+timer.rounds+' rounds)?')) return; timerReset(); }
  else if(a==='t-plus'){ timer.rounds++; render(); }
  else if(a==='t-minus'){ if(timer.rounds>0) timer.rounds--; render(); }
  else if(a==='t-log'){
    if(timer.st==='running') timer.remaining=Math.max(0,(timer.endAt-Date.now())/1000);
    if(timer.rounds<1){ toast('Tap +1 after each round first'); return; }
    var mins=Math.max(1,Math.round((progSecs()-timer.remaining)/60)), r=timer.rounds; timerReset(); logRounds(r,mins); render();
  }
}
var app=document.getElementById('app');
app.addEventListener('click',function(e){ var el=e.target.closest('[data-act]'); if(el&&!el.disabled) act(el,e); });
app.addEventListener('keydown',function(e){ if((e.key==='Enter'||e.key===' ')&&e.target.matches('[role="button"],[role="tab"]')){ e.preventDefault(); act(e.target,e); } });
app.addEventListener('submit',function(e){
  e.preventDefault(); var f=e.target, k=f.dataset.submit;
  if(k==='food'){
    var name=val('fd-name').trim(), kc=parseFloat(val('fd-kcal')), pr=parseFloat(val('fd-prot'));
    if(!name||isNaN(kc)){ toast('Add a name and calories'); return; }
    state.foodLog.push({id:uid(),date:fuelDay||ymd(),name:name,kcal:Math.round(kc),protein:isNaN(pr)?null:Math.round(pr)});
    persist(); ui.refocus='fd-name'; render(); toast('Added');
  } else if(k==='lift'){
    var i=parseInt(f.dataset.i,10), l=state.lifts[i], r=parseInt(val('lr'),10);
    if(isNaN(r)){ toast('Enter reps'); return; }
    if(l.bodyweight) l.history.push({date:ymd(),reps:r});
    else { var w=parseFloat(val('lw')); if(isNaN(w)){ toast('Enter weight'); return; } l.history.push({date:ymd(),weight:w,reps:r}); }
    ui.logLift=null; persist(); render(); toast('Logged');
  } else if(k==='rounds'){
    var rr=parseInt(val('mr-rounds'),10); if(isNaN(rr)||rr<1){ toast('Enter rounds'); return; }
    logRounds(rr,(state.program&&state.program.minutes)||20); render();
  }
});

/* ---------------- coach panel ---------------- */
function refreshTextarea(){ document.getElementById('json-input').value=JSON.stringify(state,null,2); }
document.getElementById('copy').addEventListener('click',function(){
  var txt=JSON.stringify(state,null,2);
  if(navigator.clipboard) navigator.clipboard.writeText(txt).then(function(){toast('Current data copied');},function(){refreshTextarea();toast('Copy failed — use the text box');});
  else { refreshTextarea(); toast('Copy from the text box'); }
});
document.getElementById('push').addEventListener('click',function(){ if(cloud){ pushCloud(); toast('Pushed to cloud'); } else toast('Cloud not connected'); });
document.getElementById('reset').addEventListener('click',function(){ if(confirm('Discard everything on this device and reset to the file?')){ state=migrate(clone(SEED)); persist(); render(); refreshTextarea(); } });
document.getElementById('apply').addEventListener('click',function(){
  try{ var v=document.getElementById('json-input').value.trim().replace(/^(var|const|let)\s+\w+\s*=\s*/,'').replace(/;\s*$/,''); state=migrate(JSON.parse(v)); persist(); render(); toast('Applied'); }
  catch(err){ toast('JSON error — check the paste'); }
});
document.getElementById('food-add-json').addEventListener('click',function(){
  try{
    var raw=JSON.parse(document.getElementById('food-json').value.trim().replace(/^```(json)?/,'').replace(/```$/,''));
    var arr=Array.isArray(raw)?raw:(raw.entries||raw.foodLog||[]), added=0;
    arr.forEach(function(x){
      if(!x||!x.date||!x.name||x.kcal==null) return;
      var dup=state.foodLog.some(function(y){return y.date===x.date&&y.name===x.name&&y.kcal===Math.round(x.kcal);});
      if(dup) return;
      state.foodLog.push({id:uid(),date:x.date,name:String(x.name),kcal:Math.round(x.kcal),protein:x.protein==null?null:Math.round(x.protein)}); added++;
    });
    state.foodLog.sort(byDate); persist(); render(); refreshTextarea();
    document.getElementById('food-json').value=''; toast(added+' food entr'+(added===1?'y':'ies')+' added');
  }catch(err){ toast('JSON error — check the paste'); }
});

/* ---------------- data layer: render first, Firebase second ---------------- */
var cloud=false, docRef=null, fb=null, pendingSnap=null, writeTimer=null;
function applyPendingOrRender(){ if(pendingSnap){ state=migrate(pendingSnap); pendingSnap=null; saveLocal(); } render(); }
function pushCloud(){ if(docRef&&fb) fb.setDoc(docRef,JSON.parse(JSON.stringify(state))).catch(function(){ toast('Cloud save failed'); }); }
function persist(){ saveLocal(); if(cloud){ clearTimeout(writeTimer); writeTimer=setTimeout(pushCloud,400); } }
function initCloud(){
  if(!FIREBASE_CONFIG.apiKey) return;
  var base='https://www.gstatic.com/firebasejs/'+FB_VERSION+'/';
  Promise.all([import(base+'firebase-app.js'),import(base+'firebase-firestore.js')]).then(function(m){
    var app=m[0].initializeApp(FIREBASE_CONFIG), db=m[1].getFirestore(app);
    fb=m[1]; docRef=fb.doc(db,'clients',CLIENT_ID);
    fb.onSnapshot(docRef,function(snap){
      if(snap.exists()){ var inc=migrate(snap.data()); if(isEditing()){ pendingSnap=inc; return; } state=inc; saveLocal(); cloud=true; render(); }
      else { cloud=true; pushCloud(); render(); }
    },function(){ cloud=false; render(); });
    cloud=true; render();
  }).catch(function(){ cloud=false; });
}
document.addEventListener('focusout',function(){ setTimeout(function(){ if(pendingSnap&&!isEditing()) applyPendingOrRender(); },50); });

try{ if(localStorage.getItem('hw_theme')==='dark') document.body.classList.add('dark'); }catch(e){}
state=migrate(loadLocal());
render(); refreshTextarea(); initCloud();
</script>
