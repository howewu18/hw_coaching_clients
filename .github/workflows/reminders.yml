name: Client reminders

on:
  schedule:
    # Asked for every 10 minutes (off the busy :00 marks). GitHub's free timer actually fires only a few times a day,
    # so reminders/send.js keeps each nudge valid for hours. For on-time nudges, trigger this workflow from an outside
    # scheduler instead (see CLAUDE.md, "Reminder timing").
    - cron: '6,16,26,36,46,56 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'normal = real run, dry = check only (sends nothing), test = send a test to every device'
        type: choice
        options: [normal, dry, test]
        default: dry

permissions:
  contents: read

concurrency:
  group: client-reminders
  cancel-in-progress: false

jobs:
  send:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@v5
      - uses: actions/setup-node@v5
        with:
          node-version: 22
      - run: npm install --no-save --no-audit --no-fund firebase-admin@12
      - run: node reminders/send.js
        env:
          FIREBASE_SERVICE_ACCOUNT: ${{ secrets.FIREBASE_SERVICE_ACCOUNT }}
          MODE: ${{ github.event.inputs.mode || 'normal' }}
